<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>먹킷리스트</title>

<!-- 홈 화면에 추가했을 때 앱처럼 보이도록 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="먹킷리스트">
<meta name="theme-color" content="#FAF9F5">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF9F5;
    --card:#FFFFFF;
    --ink:#17181A;
    --muted:#6E6F68;
    --faint:#A9AA9F;
    --line:#E4E2D8;
    --accent:#26313D;
    --accent-soft:#EEF0F1;
    --taupe:#8E7B5E;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Noto Sans KR",-apple-system,system-ui,sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .serif{font-family:"Noto Serif KR",serif;}
  .mono{font-family:"JetBrains Mono",monospace;}

  .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:96px;}

  /* ===== Header ===== */
  header{padding:36px 24px 20px;}
  .eyebrow{
    font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.16em;
    color:var(--taupe);text-transform:uppercase;margin:0 0 14px;
  }
  .brand h1{
    font-family:"Noto Serif KR",serif;font-weight:600;font-size:30px;margin:0;
    letter-spacing:-.01em;line-height:1.1;
  }
  .tagline{margin:10px 0 0;color:var(--muted);font-size:13.5px;line-height:1.6;max-width:34ch;}
  .rec-count{
    font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--faint);
    margin-top:16px;padding-top:16px;border-top:1px solid var(--line);
  }

  /* ===== Tabs ===== */
  nav.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:20;padding:0 24px;}
  nav.tabs button{
    padding:14px 0;margin-right:28px;background:none;border:none;cursor:pointer;
    font-family:"Noto Sans KR",sans-serif;font-size:13.5px;font-weight:500;color:var(--faint);
    border-bottom:1.5px solid transparent;transition:.15s;letter-spacing:-.01em;
  }
  nav.tabs button.active{color:var(--ink);border-bottom-color:var(--ink);font-weight:600;}

  /* ===== Views ===== */
  .view{display:none;padding:28px 24px;animation:fade .2s ease;}
  .view.active{display:block;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}

  /* ===== Filter chips (text-based, no fill) ===== */
  .chips{display:flex;gap:20px;margin-bottom:24px;}
  .chip{
    font-family:"Noto Sans KR",sans-serif;font-size:12.5px;font-weight:500;
    background:none;border:none;padding:0 0 4px;color:var(--faint);cursor:pointer;
    border-bottom:1.5px solid transparent;transition:.15s;
  }
  .chip.active{color:var(--ink);border-bottom-color:var(--accent);}

  /* ===== Pick view ===== */
  .pick-stage{min-height:280px;display:flex;flex-direction:column;justify-content:center;}
  .pick-empty{color:var(--faint);font-size:13.5px;line-height:1.8;text-align:center;padding:40px 0;}
  .pick-empty .mono{font-size:11px;display:block;margin-top:6px;}

  .pick-card{
    opacity:0;visibility:hidden;transform:translateY(6px);
    transition:opacity .28s ease, transform .28s ease;
  }
  .pick-card.show{opacity:1;visibility:visible;transform:translateY(0);}
  .pick-card.fading{opacity:0;transform:translateY(-4px);}

  .pick-label{
    font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.12em;
    color:var(--taupe);text-transform:uppercase;margin-bottom:12px;
  }
  .pick-name{font-family:"Noto Serif KR",serif;font-weight:600;font-size:32px;margin:0 0 8px;line-height:1.2;letter-spacing:-.01em;}
  .pick-memo{color:var(--muted);font-size:13.5px;margin:0 0 22px;}

  .pick-nutri{
    display:flex;gap:0;margin-bottom:26px;border-top:1px solid var(--line);
  }
  .pick-nutri .stat{
    flex:1;padding:14px 12px 0 0;
  }
  .pick-nutri .stat + .stat{border-left:1px solid var(--line);padding-left:14px;}
  .pick-nutri .stat .n{font-family:"JetBrains Mono",monospace;font-weight:500;font-size:14px;color:var(--ink);display:block;margin-bottom:3px;}
  .pick-nutri .stat .l{font-size:10px;color:var(--faint);letter-spacing:.04em;}

  .pick-actions{display:flex;gap:10px;}

  .btn{
    font-family:"Noto Sans KR",sans-serif;font-weight:500;font-size:13px;padding:11px 18px;
    border-radius:2px;border:1px solid var(--ink);cursor:pointer;transition:.15s;background:transparent;color:var(--ink);
  }
  .btn-primary{background:var(--ink);color:#fff;border-color:var(--ink);}
  .btn-primary:hover{background:#000;}
  .btn-ghost:hover{background:var(--accent-soft);}
  .btn-wide{width:100%;}
  .btn-lg{padding:15px;font-size:13.5px;letter-spacing:.01em;}

  .roll-btn{margin-top:26px;}

  .recipe-box{margin-top:20px;padding-top:18px;border-top:1px solid var(--line);display:none;}
  .recipe-box.open{display:block;}
  .recipe-box .rlabel{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;}
  .recipe-chips{display:flex;flex-direction:column;gap:8px;}
  .recipe-chip{
    font-size:13px;color:var(--ink);text-decoration:none;padding:9px 0;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;
  }
  .recipe-chip::after{content:"→";color:var(--faint);font-family:"JetBrains Mono",monospace;}

  /* ===== List view ===== */
  .add-form{margin-bottom:28px;}
  .flabel{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px;}
  .add-row{display:flex;gap:10px;margin-bottom:10px;}
  .add-row input, .add-row select{
    flex:1;padding:11px 0;border:none;border-bottom:1px solid var(--line);
    font-family:"Noto Sans KR",sans-serif;font-size:13.5px;background:transparent;color:var(--ink);
    border-radius:0;
  }
  .add-row select{flex:0 0 84px;}
  .add-row input:focus, .add-row select:focus{outline:none;border-bottom-color:var(--ink);}
  .add-row input::placeholder{color:var(--faint);}
  .btn-add-row{margin-top:4px;}

  .quickadd-label{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em;margin:22px 0 12px;}
  .qa-chips{display:flex;flex-wrap:wrap;gap:8px 18px;}
  .qa-chip{
    font-size:12.5px;padding:0 0 2px;border:none;border-bottom:1px solid var(--line);
    background:none;color:var(--muted);cursor:pointer;transition:.15s;
  }
  .qa-chip:hover{color:var(--ink);border-bottom-color:var(--ink);}
  .qa-chip[data-added]{opacity:.35;pointer-events:none;text-decoration:line-through;}

  .entry-count{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--faint);margin-bottom:14px;letter-spacing:.04em;}

  .entry{padding:16px 0;border-top:1px solid var(--line);}
  .entry:last-child{border-bottom:1px solid var(--line);}
  .entry-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;}
  .entry-idx{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--faint);margin-bottom:4px;}
  .entry-name{font-family:"Noto Serif KR",serif;font-weight:600;font-size:17px;margin:0 0 4px;letter-spacing:-.005em;}
  .entry-cat{
    font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--taupe);
  }
  .entry-memo{font-size:12.5px;color:var(--muted);margin-top:6px;}
  .entry-del{background:none;border:none;color:var(--faint);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;font-family:"JetBrains Mono",monospace;}
  .entry-del:hover{color:var(--ink);}
  .entry-nutri-toggle{
    margin-top:10px;font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--muted);
    cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line);
  }
  .entry-nutri{
    display:none;margin-top:12px;padding:14px 0 2px;border-top:1px solid var(--line);
    font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--muted);line-height:2;
  }
  .entry-nutri.open{display:block;}
  .entry-nutri .row{display:flex;justify-content:space-between;}
  .entry-nutri .row b{color:var(--ink);font-weight:500;}

  .empty-state{text-align:center;padding:60px 20px;color:var(--faint);}
  .empty-state .serif{font-size:15px;margin-bottom:6px;color:var(--muted);}
  .empty-state .mono{font-size:11px;}

  /* ===== Dict view ===== */
  .dict-entry{padding:16px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:14px;}
  .dict-entry:last-child{border-bottom:1px solid var(--line);}
  .dict-name{font-family:"Noto Serif KR",serif;font-weight:600;font-size:16px;margin:0 0 6px;}
  .dict-meta{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);line-height:1.8;}
  .dict-add{
    flex:0 0 auto;font-family:"Noto Sans KR",sans-serif;font-size:12px;font-weight:500;
    padding:7px 14px;border:1px solid var(--ink);background:transparent;color:var(--ink);
    border-radius:2px;cursor:pointer;white-space:nowrap;transition:.15s;
  }
  .dict-add:hover{background:var(--accent-soft);}
  .dict-add[data-added]{border-color:var(--line);color:var(--faint);cursor:default;}
  .dict-add[data-added]:hover{background:transparent;}

  footer{
    position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);
    padding:10px 0 max(10px, env(safe-area-inset-bottom));
  }
  .footer-inner{max-width:480px;margin:0 auto;font-family:"JetBrains Mono",monospace;font-size:9.5px;color:var(--faint);text-align:center;letter-spacing:.05em;padding:0 24px;}
</style>
</head>
<body>
<div class="app">

  <header>
    <p class="eyebrow">Personal Food Record</p>
    <div class="brand"><h1>먹킷리스트</h1></div>
    <p class="tagline">먹고 싶던 걸, 먹을 때 기억하기 위한 기록.</p>
    <p class="rec-count mono" id="rec-count">0 entries</p>
  </header>

  <nav class="tabs">
    <button class="active" data-tab="pick">오늘 뭐 먹지</button>
    <button data-tab="list">내 바구니</button>
    <button data-tab="dict">사전</button>
  </nav>

  <!-- ===== PICK VIEW ===== -->
  <section class="view active" id="view-pick">
    <div class="chips" id="pick-chips"></div>

    <div class="pick-stage" id="pick-stage">
      <div class="pick-empty" id="pick-empty">
        아직 등록된 항목이 없어요.
        <span class="mono">「내 목록」 탭에서 먼저 몇 개 채워보세요.</span>
      </div>

      <div class="pick-card" id="pick-card">
        <p class="pick-label" id="pick-cat"></p>
        <h2 class="pick-name" id="pick-name"></h2>
        <p class="pick-memo" id="pick-memo"></p>

        <div class="pick-nutri" id="pick-nutri" style="display:none;"></div>

        <div class="pick-actions">
          <button class="btn btn-primary" id="btn-ate">먹었어요</button>
          <button class="btn btn-ghost" id="btn-recipe">레시피 보기</button>
        </div>

        <div class="recipe-box" id="recipe-box">
          <div class="rlabel">Suggested Search</div>
          <div class="recipe-chips" id="recipe-chips"></div>
        </div>
      </div>
    </div>

    <button class="btn btn-primary btn-wide btn-lg roll-btn" id="btn-roll">뽑기</button>
  </section>

  <!-- ===== LIST VIEW ===== -->
  <section class="view" id="view-list">
    <div class="add-form">
      <div class="flabel">New Entry</div>
      <div class="add-row">
        <select id="new-cat">
          <option value="식당">식당</option>
          <option value="요리">요리</option>
          <option value="식재료">식재료</option>
        </select>
        <input type="text" id="new-name" placeholder="이름 (예: 마라탕)">
      </div>
      <div class="add-row">
        <input type="text" id="new-memo" placeholder="메모 (선택)">
      </div>
      <div class="flabel" style="margin-top:14px;">Nutrition (선택 — 직접 조사한 값 입력)</div>
      <div class="add-row">
        <input type="text" id="new-kcal" placeholder="칼로리 (예: 120)" inputmode="numeric" style="flex:0 0 40%;">
        <input type="text" id="new-key" placeholder="주성분 (예: 비타민C)">
      </div>
      <div class="add-row">
        <input type="text" id="new-note" placeholder="효능 (예: 면역력 강화)">
      </div>
      <button class="btn btn-primary btn-add-row" id="btn-add">추가</button>

      <p style="margin-top:22px;font-size:12.5px;color:var(--faint);">
        슈퍼푸드는 「사전」 탭에서 골라 담을 수 있어요 →
      </p>
    </div>

    <div class="chips" id="list-chips"></div>
    <div class="entry-count" id="entry-count"></div>
    <div id="entry-list"></div>
  </section>

  <!-- ===== DICT VIEW ===== -->
  <section class="view" id="view-dict">
    <p class="tagline" style="margin-bottom:24px;max-width:none;">
      운영자가 미리 정리해둔 슈퍼푸드 사전이에요. 마음에 드는 걸 「담기」하면 내 바구니로 들어가고, 뽑기에도 포함돼요.
    </p>
    <div id="dict-list"></div>
  </section>

</div>

<footer>
  <div class="footer-inner">LOCAL STORAGE · 이 기기에만 저장됩니다</div>
</footer>

<script>
/* ---------- 영양 데이터 (100g 기준) ---------- */
const NUTRI = {
  "블루베리": {kcal:57, key:"항산화 안토시아닌", note:"눈 건강·항산화"},
  "그릭요거트": {kcal:97, key:"단백질 9g", note:"장 건강·근육 회복"},
  "연어": {kcal:206, key:"오메가3", note:"염증 완화·두뇌 건강"},
  "시금치": {kcal:23, key:"철분·엽산", note:"빈혈 예방"},
  "달걀": {kcal:155, key:"완전단백질", note:"근육 합성"},
  "아보카도": {kcal:160, key:"불포화지방", note:"혈관 건강"},
  "고구마": {kcal:86, key:"식이섬유", note:"혈당 관리"},
  "귀리": {kcal:389, key:"베타글루칸", note:"콜레스테롤 개선"},
  "브로콜리": {kcal:34, key:"비타민C", note:"면역력"},
  "견과류": {kcal:607, key:"불포화지방", note:"두뇌·혈관 건강"},
  "두부": {kcal:76, key:"식물성 단백질", note:"근육·다이어트"},
  "바나나": {kcal:89, key:"칼륨", note:"근육 경련 예방"},
  "토마토": {kcal:18, key:"라이코펜", note:"항산화·피부"},
  "마늘": {kcal:149, key:"알리신", note:"면역·혈행 개선"},
  "김치": {kcal:15, key:"유산균", note:"장 건강"},
  "닭가슴살": {kcal:165, key:"저지방 단백질", note:"근육 유지·다이어트"},
  "퀴노아": {kcal:120, key:"완전 아미노산", note:"혈당·포만감"},
  "렌틸콩": {kcal:116, key:"식물성 단백질·철분", note:"혈당 관리·포만감"},
  "케일": {kcal:49, key:"비타민K·칼슘", note:"뼈 건강·해독"},
  "석류": {kcal:83, key:"폴리페놀", note:"항산화·혈행"},
  "버섯": {kcal:22, key:"비타민D·베타글루칸", note:"면역력"},
  "청국장": {kcal:196, key:"낫토키나제·유산균", note:"혈행·장 건강"},
  "미역": {kcal:45, key:"요오드·식이섬유", note:"갑상선·다이어트"},
  "치아씨드": {kcal:486, key:"오메가3·식이섬유", note:"포만감·혈당"},
  "다크초콜릿": {kcal:546, key:"플라보노이드", note:"항산화·혈압"},
  "낫토": {kcal:212, key:"낫토키나제", note:"혈행 개선"},
  "굴": {kcal:81, key:"아연", note:"면역·피로 회복"},
  "미나리": {kcal:20, key:"베타카로틴", note:"해독·부기 완화"},
  "새우": {kcal:99, key:"저지방 단백질", note:"근육·다이어트"},
  "무화과": {kcal:74, key:"식이섬유·칼륨", note:"장 건강·혈압"}
};

/* ---------- 상태 ---------- */
let items = [];
let pickFilter = "all";
let listFilter = "all";
let currentPick = null;

const STORE_KEY = "meokkit_items_v2";
function load(){
  try{ items = JSON.parse(localStorage.getItem(STORE_KEY)) || seedData(); }
  catch(e){ items = seedData(); }
  if(items.length===0) items = seedData();
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(items)); }
function seedData(){
  return [
    {id:crypto.randomUUID(), name:"블루베리", cat:"식재료", memo:"", lastEaten:0, nutri:NUTRI["블루베리"]},
    {id:crypto.randomUUID(), name:"그릭요거트", cat:"식재료", memo:"", lastEaten:0, nutri:NUTRI["그릭요거트"]},
    {id:crypto.randomUUID(), name:"닭가슴살", cat:"식재료", memo:"", lastEaten:0, nutri:NUTRI["닭가슴살"]},
    {id:crypto.randomUUID(), name:"마라탕", cat:"요리", memo:"광명동 그 집", lastEaten:0},
    {id:crypto.randomUUID(), name:"김치찌개", cat:"요리", memo:"", lastEaten:0},
    {id:crypto.randomUUID(), name:"연어 스테이크", cat:"요리", memo:"", lastEaten:0, nutri:NUTRI["연어"]},
    {id:crypto.randomUUID(), name:"청국장 정식", cat:"요리", memo:"", lastEaten:0, nutri:NUTRI["청국장"]},
    {id:crypto.randomUUID(), name:"동네 파스타집", cat:"식당", memo:"", lastEaten:0},
    {id:crypto.randomUUID(), name:"삼산 초밥집", cat:"식당", memo:"", lastEaten:0},
    {id:crypto.randomUUID(), name:"다운동 삼겹살집", cat:"식당", memo:"", lastEaten:0},
  ];
}

function fmtCount(n){ return n + (n===1 ? " entry" : " entries"); }

function renderChips(targetId, current, onPick){
  const cats = ["all","식당","요리","식재료"];
  const labels = {all:"전체", 식당:"식당", 요리:"요리", 식재료:"식재료"};
  const el = document.getElementById(targetId);
  el.innerHTML = "";
  cats.forEach(c=>{
    const b = document.createElement("button");
    b.className = "chip" + (c===current ? " active" : "");
    b.textContent = labels[c];
    b.onclick = ()=> onPick(c);
    el.appendChild(b);
  });
}

function renderPickChips(){
  renderChips("pick-chips", pickFilter, (c)=>{ pickFilter = c; renderPickChips(); });
}

function eligibleItems(){
  return pickFilter==="all" ? items : items.filter(x=>x.cat===pickFilter);
}

function pickWeighted(pool){
  const now = Date.now();
  const weighted = pool.map(it=>{
    const daysSince = it.lastEaten ? (now - it.lastEaten) / 86400000 : 999;
    const weight = Math.min(1, daysSince / 7) + 0.05;
    return {item: it, weight};
  });
  const total = weighted.reduce((s,w)=>s+w.weight, 0);
  let r = Math.random() * total;
  let picked = weighted[0].item;
  for(const w of weighted){
    r -= w.weight;
    if(r <= 0){ picked = w.item; break; }
  }
  return picked;
}

function roll(){
  const pool = eligibleItems();
  const card = document.getElementById("pick-card");
  const recipeBox = document.getElementById("recipe-box");

  if(pool.length===0){
    card.classList.remove("show");
    document.getElementById("pick-empty").style.display = "block";
    return;
  }
  document.getElementById("pick-empty").style.display = "none";

  const reveal = ()=>{
    currentPick = pickWeighted(pool);
    renderPickCard(currentPick);
    recipeBox.classList.remove("open");
    card.classList.remove("fading");
    card.classList.add("show");
  };

  if(card.classList.contains("show")){
    // 이미 카드가 떠있으면 먼저 페이드아웃 후, 사라진 뒤 새 내용으로 페이드인
    card.classList.add("fading");
    setTimeout(reveal, 260);
  } else {
    reveal();
  }
}

function renderPickCard(it){
  document.getElementById("pick-cat").textContent = it.cat;
  document.getElementById("pick-name").textContent = it.name;
  document.getElementById("pick-memo").textContent = it.memo || "";
  document.getElementById("pick-memo").style.display = it.memo ? "block" : "none";

  const nutriBox = document.getElementById("pick-nutri");
  if(it.nutri){
    nutriBox.style.display = "flex";
    nutriBox.innerHTML = `
      <div class="stat"><span class="n">${it.nutri.kcal} kcal</span><span class="l">100g 기준</span></div>
      <div class="stat"><span class="n">${it.nutri.key}</span><span class="l">주성분</span></div>
      <div class="stat"><span class="n">${it.nutri.note}</span><span class="l">효능</span></div>
    `;
  } else {
    nutriBox.style.display = "none";
  }
}

document.getElementById("btn-roll").onclick = roll;

document.getElementById("btn-ate").onclick = async ()=>{
  if(!currentPick) return;
  currentPick.lastEaten = Date.now();
  await save();
  roll();
};

document.getElementById("btn-recipe").onclick = ()=>{
  if(!currentPick) return;
  const box = document.getElementById("recipe-box");
  const chipsEl = document.getElementById("recipe-chips");
  const ideas = recipeIdeasFor(currentPick.name);
  chipsEl.innerHTML = "";
  ideas.forEach(idea=>{
    const a = document.createElement("a");
    a.className = "recipe-chip";
    a.href = "https://www.youtube.com/results?search_query=" + encodeURIComponent(idea);
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = idea;
    chipsEl.appendChild(a);
  });
  box.classList.toggle("open");
};

function recipeIdeasFor(name){
  const base = name;
  return [`${base} 레시피`, `${base} 만드는 법`, `${base} 활용 요리`];
}

function renderListChips(){
  renderChips("list-chips", listFilter, (c)=>{ listFilter = c; renderListChips(); renderList(); });
}

function renderDict(){
  const el = document.getElementById("dict-list");
  el.innerHTML = "";
  Object.keys(NUTRI).forEach(name=>{
    const nutri = NUTRI[name];
    const already = items.some(it=>it.name===name);
    const row = document.createElement("div");
    row.className = "dict-entry";
    row.innerHTML = `
      <div>
        <div class="dict-name">${name}</div>
        <div class="dict-meta">${nutri.kcal} kcal · ${nutri.key} · ${nutri.note}</div>
      </div>
      <button class="dict-add" ${already ? "data-added=\"1\"" : ""} data-name="${name}">
        ${already ? "담음" : "담기"}
      </button>
    `;
    el.appendChild(row);
  });
}

document.getElementById("dict-list").addEventListener("click", async (e)=>{
  const btn = e.target.closest(".dict-add");
  if(!btn || btn.hasAttribute("data-added")) return;
  const name = btn.dataset.name;
  items.push({id:crypto.randomUUID(), name, cat:"식재료", memo:"", lastEaten:0, nutri:NUTRI[name]});
  await save();
  renderDict();
  renderList();
});

document.getElementById("btn-add").onclick = async ()=>{
  const nameEl = document.getElementById("new-name");
  const catEl = document.getElementById("new-cat");
  const memoEl = document.getElementById("new-memo");
  const kcalEl = document.getElementById("new-kcal");
  const keyEl = document.getElementById("new-key");
  const noteEl = document.getElementById("new-note");
  const name = nameEl.value.trim();
  if(!name) return;

  // 직접 입력한 영양정보가 있으면 그걸 우선, 없으면 사전 등록된 슈퍼푸드 데이터 사용
  let nutri = null;
  const kcalVal = kcalEl.value.trim();
  const keyVal = keyEl.value.trim();
  const noteVal = noteEl.value.trim();
  if(kcalVal || keyVal || noteVal){
    nutri = { kcal: kcalVal || "-", key: keyVal || "-", note: noteVal || "-" };
  } else {
    nutri = NUTRI[name] || null;
  }

  items.push({id:crypto.randomUUID(), name, cat:catEl.value, memo:memoEl.value.trim(), lastEaten:0, nutri});
  await save();
  nameEl.value = ""; memoEl.value = ""; kcalEl.value = ""; keyEl.value = ""; noteEl.value = "";
  renderList();
  renderDict();
};

function renderList(){
  const pool = listFilter==="all" ? items : items.filter(x=>x.cat===listFilter);
  const el = document.getElementById("entry-list");
  document.getElementById("entry-count").textContent = fmtCount(pool.length);
  document.getElementById("rec-count").textContent = fmtCount(items.length);

  if(pool.length===0){
    el.innerHTML = `<div class="empty-state"><div class="serif">— 기록 없음 —</div><div class="mono">위에서 새 항목을 추가해보세요</div></div>`;
    return;
  }

  el.innerHTML = "";
  pool.forEach((it, i)=>{
    const card = document.createElement("div");
    card.className = "entry";
    card.innerHTML = `
      <div class="entry-top">
        <div>
          <div class="entry-idx">No. ${String(i+1).padStart(3,"0")}</div>
          <div class="entry-name">${it.name}</div>
          <span class="entry-cat">${it.cat}</span>
          ${it.memo ? `<div class="entry-memo">${it.memo}</div>` : ""}
          ${it.nutri ? `<div class="entry-nutri-toggle" data-nut="${it.id}">영양정보 보기</div>` : ""}
          ${it.nutri ? `
            <div class="entry-nutri" id="nb-${it.id}">
              <div class="row"><span>열량</span><b>${it.nutri.kcal} kcal/100g</b></div>
              <div class="row"><span>주성분</span><b>${it.nutri.key}</b></div>
              <div class="row"><span>효능</span><b>${it.nutri.note}</b></div>
            </div>` : ""}
        </div>
        <button class="entry-del" data-del="${it.id}">✕</button>
      </div>
    `;
    el.appendChild(card);
  });
}

document.getElementById("entry-list").addEventListener("click", async (e)=>{
  const del = e.target.closest("[data-del]");
  const nut = e.target.closest("[data-nut]");
  if(del){
    items = items.filter(x=>x.id!==del.dataset.del);
    await save();
    renderList();
    renderDict();
  }
  if(nut){
    document.getElementById("nb-"+nut.dataset.nut).classList.toggle("open");
  }
});

document.querySelectorAll("nav.tabs button").forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("view-"+btn.dataset.tab).classList.add("active");
  };
});

(function init(){
  load();
  renderPickChips();
  renderListChips();
  renderDict();
  renderList();
  document.getElementById("rec-count").textContent = fmtCount(items.length);
})();

/* ---------- PWA: 서비스워커 등록 (오프라인 지원) ---------- */
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
